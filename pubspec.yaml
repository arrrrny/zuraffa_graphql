name: zuraffa_graphql
description: GraphQL capability for Zuraffa — schema-driven datasource generation, gql documents, and the graphql client surface (optional companion package; issue #1661).
version: 7.3.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa_graphql
issue_tracker: https://github.com/arrrrny/zuraffa_graphql/issues

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.7.0
  code_builder: ^4.12.0
  dart_style: ^3.1.13
  graphql: ^5.2.4
  gql: ^1.0.1
  http: ^1.6.0
  path: ^1.9.1
  zuraffa: ^7.3.0

dev_dependencies:
  test: ^1.33.0

# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
dependency_overrides:
  xml: 7.1.0

  zuraffa:
    path: ../zuraffa
